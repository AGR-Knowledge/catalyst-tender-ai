<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalyst_Tender_AI — Product Wireframe &amp; Role Dashboards</title>
<style>
:root{
  --navy:#102A33; --navy2:#1B3D48; --navy3:#0A1D24;
  --teal:#15847B; --teal-d:#0E5F58; --teal-t:#E7F1EF;
  --purple:#7B47AA; --purple-t:#EFE7F5;
  --amber:#D98324; --amber-d:#B9710F; --amber-t:#FBEEDD;
  --coral:#E2574C; --coral-t:#FBEDEB;
  --grey:#5A6B72; --grey-m:#8A979D; --line:#DCE5E4; --bg:#F3F6F6; --white:#fff;
  --r:10px; --sh:0 2px 10px rgba(10,29,36,.07); --sh2:0 6px 22px rgba(10,29,36,.13);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);
  font-family:"Segoe UI",Calibri,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:700}
.mono{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{background:var(--navy);color:#fff;padding:0 22px;display:flex;align-items:center;gap:22px;
  height:62px;position:sticky;top:0;z-index:50;box-shadow:var(--sh2)}
.brand{display:flex;align-items:center;gap:11px}
.brandmark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#4FB3A5);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.brand b{font-size:15px;letter-spacing:.3px}
.brand span{display:block;font-size:10.5px;color:#8FB0AD;letter-spacing:1.4px;text-transform:uppercase}
.nav{display:flex;gap:6px;margin-left:14px}
.nav button{background:transparent;border:0;color:#BFD3D0;padding:8px 15px;border-radius:8px;
  font:inherit;font-size:13px;cursor:pointer}
.nav button:hover{background:var(--navy2);color:#fff}
.nav button.on{background:var(--teal);color:#fff;font-weight:600}
.ctx{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#BFD3D0}
.ctx select{background:var(--navy2);color:#fff;border:1px solid #2A5260;border-radius:7px;
  padding:7px 10px;font:inherit;font-size:12.5px}
.who{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid #2A5260}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 62px)}
.shell.full{grid-template-columns:1fr}
.rail{background:#fff;border-right:1px solid var(--line);padding:16px 12px}
.rail h4{font-size:10.5px;letter-spacing:1.3px;color:var(--grey-m);text-transform:uppercase;
  margin:6px 8px 10px}
.persona{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;
  border:0;padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit;margin-bottom:2px}
.persona:hover{background:var(--bg)}
.persona.on{background:var(--teal-t)}
.persona.on .pname{color:var(--teal-d)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.pname{font-weight:600;font-size:13px;display:block}
.prole{font-size:11px;color:var(--grey);display:block;line-height:1.3}
.main{padding:22px 26px 40px;overflow:auto}
.phead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead h2{font-size:22px}
.phead p{margin:3px 0 0;color:var(--grey);font-size:13px;max-width:760px}
.stagetag{margin-left:auto;font-size:11px;color:var(--grey);background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;white-space:nowrap}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:16px}
.c1{grid-column:span 12}.c2{grid-column:span 2}.c3{grid-column:span 3}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}
.g12{grid-template-columns:repeat(12,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>header h3{font-size:13.5px}
.card>header .sub{font-size:11.5px;color:var(--grey-m);margin-left:auto}
.pad{padding:15px 16px}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi .lab{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.7px}
.kpi .val{font-size:27px;font-weight:700;margin-top:5px;line-height:1.1}
.kpi .fut{font-size:11.5px;color:var(--grey-m);margin-top:3px}
.up{color:var(--teal)}.dn{color:var(--coral)}

/* ---------- pills / chips ---------- */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-teal{background:var(--teal-t);color:var(--teal-d)}
.p-purple{background:var(--purple-t);color:var(--purple)}
.p-amber{background:var(--amber-t);color:var(--amber-d)}
.p-coral{background:var(--coral-t);color:var(--coral)}
.p-grey{background:var(--bg);color:var(--grey)}
.p-navy{background:var(--navy);color:#fff}
.ai{background:var(--purple);color:#fff;font-size:9.5px;padding:2px 7px;border-radius:20px;
  font-weight:700;letter-spacing:.5px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--grey-m);
  padding:9px 16px;border-bottom:1px solid var(--line);font-weight:600;background:#FAFCFB}
td{padding:10px 16px;border-bottom:1px solid #EEF3F2;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFB}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- bars ---------- */
.bar{display:grid;grid-template-columns:132px 1fr 52px;gap:11px;align-items:center;margin-bottom:9px;font-size:12.5px}
.track{height:9px;background:var(--bg);border-radius:20px;overflow:hidden}
.fill{height:100%;border-radius:20px}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;margin-bottom:8px}
.stack div{display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:600}

/* ---------- donut ---------- */
.donut{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.donut i{width:80px;height:80px;background:#fff;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-weight:700;font-size:19px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12px;justify-content:center}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px}

/* ---------- workflow ---------- */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.stage{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;
  box-shadow:var(--sh);position:relative;transition:.15s}
.stage:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--teal)}
.stage.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-t),var(--sh2)}
.stage .n{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:12px;margin-bottom:8px}
.stage h4{font-size:12.5px;line-height:1.25;margin-bottom:6px}
.stage p{margin:0;font-size:11px;color:var(--grey);line-height:1.35}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}
.gate{background:var(--amber-t);border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;align-items:center}
.gate b{display:block;font-size:12.5px}
.gate small{color:var(--grey);font-size:11px}
.drawer{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px 20px;margin-top:16px}
.drawer h3{font-size:16px;margin-bottom:3px}
.drawer .cap{font-size:12px;color:#8FB0AD;margin-bottom:14px}
.dcols{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.dcols h5{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--teal);margin:0 0 8px}
.dcols ul{margin:0;padding-left:16px;font-size:12px;color:#D6E4E2}
.dcols li{margin-bottom:5px}

/* ---------- swimlane ---------- */
.lane{display:grid;grid-template-columns:190px repeat(9,1fr);font-size:11px;align-items:stretch}
.lane>div{padding:9px 7px;border-bottom:1px solid var(--line);display:grid;place-items:center}
.lane .rl{justify-content:start;place-items:center start;font-weight:600;font-size:12px;
  padding-left:14px;background:#FAFCFB}
.lane .hd{background:var(--navy);color:#fff;font-weight:700;font-size:11px;border-bottom:0;padding:11px 4px;
  text-align:center;line-height:1.2}
.raci{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;font-weight:700;
  font-size:10.5px;color:#fff}

/* ---------- kanban ---------- */
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.kcol{background:var(--bg);border-radius:var(--r);padding:11px}
.kcol h5{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--grey);margin-bottom:9px;
  display:flex;justify-content:space-between}
.kitem{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12px}
.kitem b{display:block;margin-bottom:5px;font-size:12.5px}

/* ---------- misc ---------- */
.rowlist{display:flex;flex-direction:column}
.rowitem{display:flex;gap:11px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid #EEF3F2}
.rowitem:last-child{border-bottom:0}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;
  font-size:13px;flex:0 0 auto}
.rowitem b{font-size:12.5px;display:block}
.rowitem p{margin:2px 0 0;font-size:11.5px;color:var(--grey)}
.note{background:var(--teal-t);border-radius:8px;padding:11px 14px;font-size:12px;color:var(--navy);
  display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--amber-t)}
.note.risk{background:var(--coral-t)}
.matrix td:first-child{font-weight:600}
.tick{color:var(--teal);font-weight:700}
.cross{color:var(--coral);font-weight:700}
.hint{font-size:11.5px;color:var(--grey-m);margin-top:10px;font-style:italic}
.wmark{position:fixed;right:14px;bottom:12px;background:var(--navy);color:#fff;font-size:10.5px;
  padding:6px 13px;border-radius:20px;opacity:.9;z-index:40}
@media(max-width:1200px){.flow{grid-template-columns:repeat(3,1fr)}.dcols{grid-template-columns:repeat(2,1fr)}
  .c3,.c4{grid-column:span 6}}
</style>
</head>

const VIEWS = [

  {id:'dash',  label:'Role Dashboards', fn:viewDashboards, rail:true},
  {id:'agents',label:'Agent Console',   fn:viewAgents,     rail:false}
];
let activeView = 0;

function render(){
  document.getElementById('nav').innerHTML = VIEWS.map((v,i)=>
    `<button class="${i===activeView?'on':''}" onclick="pickView(${i})">${v.label}</button>`).join('');
  const v = VIEWS[activeView];
  const shell = document.getElementById('shell');
  shell.className = 'shell' + (v.rail?'':' full');
  const rail = document.getElementById('rail');
  rail.style.display = v.rail ? 'block' : 'none';
  if(v.rail){
    rail.innerHTML = '<h4>View as</h4>' + PERSONAS.map((p,i)=>
      `<button class="persona ${i===activePersona?'on':''}" onclick="pickPersona(${i})">
        <span class="dot" style="background:${p.c}"></span>
        <span><span class="pname">${p.role}</span><span class="prole">${p.name} · ${p.head}</span></span>
      </button>`).join('') +
      `<p class="hint" style="padding:0 10px">Each role sees only the stages they are Responsible or Accountable for.
        The registry underneath is the same single record.</p>`;
  }
  const p = PERSONAS[activePersona];
  document.getElementById('av').textContent = p.ini;
  document.getElementById('av').style.background = p.c;
  document.getElementById('whoName').textContent = p.name;
  document.getElementById('whoRole').innerHTML = p.role;
  document.getElementById('main').innerHTML = v.fn();
}
function pickView(i){activeView=i;render();window.scrollTo(0,0);}
function pickPersona(i){activePersona=i;render();window.scrollTo(0,0);}
